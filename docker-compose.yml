services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: event_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    env_file:
      - ./event-management-api/.env
    build:
      context: ./event-management-api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DB_NAME: event_management
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: db
      DB_PORT: 5432
      FORCE_SYNC: "true"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Event_Manager_Front_End
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
  api_uploads:
